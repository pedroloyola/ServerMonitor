# Dependabot keeps the pinned GitHub Actions visible, so an update is a decision someone
# makes rather than something that drifts in unnoticed.
#
# The Microsoft Store CLI is not an action any more: tools/release/msstore-cli-pin.json pins
# one msstore-cli release by URL, SHA-256, signer and product version, and
# tools/release/Install-MsStoreCli.ps1 refuses anything else. Dependabot cannot see that pin;
# updating it is a reviewed pull request (docs/release-automation.md). Never re-introduce
# microsoft-store-apppublisher: it installs whatever msstore-cli release is latest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
    labels:
      - dependencies
      - github-actions
