name: CI

# Deterministic build + test + vulnerability scan for the Windows x64 app.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repository. No write scopes, no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These jobs are intentionally independent: Actions can run them concurrently, so CI
  # wall-clock is bounded by the slower path instead of the sum of both builds.
  debug-test:
    name: Debug build + tests
    runs-on: windows-latest
    steps:
      # First-party actions from the trusted `actions/` org. Pin to a commit SHA for
      # stricter supply-chain hardening if required by policy.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Cache packages only, never bin/, obj/, test outputs, or assemblies. The Directory.*,
      # NuGet.Config, and lock-file patterns intentionally match nothing today: they are kept
      # so future repository-level dependency inputs invalidate the cache when introduced.
      - name: Cache NuGet packages
        id: nuget-cache
        uses: actions/cache@v4
        with:
          # On Windows, ~ resolves to %USERPROFILE%, the NuGet global-packages default.
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', 'global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json') }}

      - name: Verify cache isolation
        shell: pwsh
        run: |
          $buildOutputs = @(Get-ChildItem -Path src,tests -Directory -Recurse -Force |
            Where-Object { $_.Name -in @('bin', 'obj') })
          if ($buildOutputs.Count -ne 0) {
            throw "The package cache restored build outputs: $($buildOutputs.FullName -join ', ')"
          }
          Write-Host 'Cache isolation verified: no bin/ or obj/ directories were restored.'

      - name: Restore
        run: dotnet restore ServerMonitor.slnx

      # Fresh, non-incremental build to avoid stale-output pitfalls (P-008).
      - name: Build (Debug)
        run: dotnet build ServerMonitor.slnx -c Debug --no-restore --no-incremental --disable-build-servers

      # The ONLY place the real Credential Manager tests run ([RealCredentialManagerFact]): an ephemeral runner, so
      # their writes cannot reach a person's vault. Never set this on a developer machine (TEST-REALDATA-AUDIT R-1).
      - name: Test
        env:
          SERVERMONITOR_RUN_REAL_CREDMAN_TESTS: '1'
        run: dotnet test ServerMonitor.slnx -c Debug --no-build --disable-build-servers

      # GitHub's job/step timestamps are the authoritative wall-clock measurement. The
      # summary adds only the cache result needed to distinguish cold and warm runs.
      - name: CI measurement
        if: ${{ always() }}
        shell: pwsh
        run: |
          @(
            '## Debug build + tests'
            ''
            '- Cache action outcome: `${{ steps.nuget-cache.outcome }}`'
            '- Exact cache hit (`true` = hit; empty = miss): `${{ steps.nuget-cache.outputs.cache-hit }}`'
            '- Job and step wall-clock: GitHub Actions timestamps (authoritative)'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  release-security:
    name: Release build + vulnerability scan
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', 'global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json') }}

      - name: Verify cache isolation
        shell: pwsh
        run: |
          $buildOutputs = @(Get-ChildItem -Path src,tests -Directory -Recurse -Force |
            Where-Object { $_.Name -in @('bin', 'obj') })
          if ($buildOutputs.Count -ne 0) {
            throw "The package cache restored build outputs: $($buildOutputs.FullName -join ', ')"
          }
          Write-Host 'Cache isolation verified: no bin/ or obj/ directories were restored.'

      - name: Restore
        run: dotnet restore ServerMonitor.slnx

      - name: Build (Release)
        run: dotnet build ServerMonitor.slnx -c Release --no-restore --no-incremental --disable-build-servers

      # PRIV-PDBPATH on every PR: the gate's own counterproofs, then the gate on the first-party
      # Release binaries and PDBs this build just wrote (the runner's checkout path must not be in
      # them). The packaged MSIX is checked by the package-privacy job below. The same assembly is
      # copied into several bin folders, and the gate refuses two artifacts with one name, so the
      # selection is staged under its src-relative path and inspected as ONE input.
      - name: Distribution privacy (Release binaries)
        shell: pwsh
        run: |
          ./tools/release/Test-DistributionPrivacy.ps1
          $source = (Resolve-Path 'src').Path
          $stage = Join-Path ([System.IO.Path]::GetTempPath()) 'first-party-release'
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          $firstParty = @(Get-ChildItem -Path $source -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]bin[\\/](x64[\\/])?Release[\\/]' -and
              $_.Name -match '^(ServerMonitor|ServerAlyzer)\..+\.(dll|pdb|json)$' })
          foreach ($file in $firstParty) {
            $target = Join-Path $stage ([System.IO.Path]::GetRelativePath($source, $file.FullName))
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          ./tools/release/Assert-DistributionPrivacy.ps1 -Path $stage -RequiredArtifacts @(
            'ServerMonitor.App.dll', 'ServerMonitor.App.pdb',
            'ServerAlyzer.WidgetProvider.dll', 'ServerAlyzer.WidgetProvider.pdb',
            'ServerMonitor.Core.dll', 'ServerMonitor.Infrastructure.dll', 'ServerMonitor.Collectors.dll',
            'ServerMonitor.Features.dll', 'ServerMonitor.WidgetContract.dll', 'ServerMonitor.ActivationContract.dll')

      # The release guards and their counterproofs on every PR, not only on release day: a change that
      # breaks the version floor, tag coherence, run provenance, the publishing hold, action pinning or
      # the release workflows' wiring fails here first. Offline: synthetic fixtures, no secret, no network.
      - name: Release guards and their counterproofs
        shell: pwsh
        run: |
          ./tools/release/Test-ValidatedPackagePath.ps1
          ./tools/release/Test-PackageVersionFloor.ps1
          ./tools/release/Test-TagVersion.ps1
          ./tools/release/Test-VersionGuardMutations.ps1
          ./tools/release/Test-ReleaseRunProvenance.ps1
          ./tools/release/Test-ManualPublishMode.ps1
          ./tools/release/Test-HardeningMutations.ps1
          ./tools/release/Test-WorkflowRunInterpolation.ps1 -SelfTest
          ./tools/release/Test-WorkflowActionPins.ps1 -SelfTest
          ./tools/release/Test-ReleaseWorkflowShape.ps1 -SelfTest

      - name: Vulnerability scan (fail on any vulnerable package)
        shell: pwsh
        run: |
          $output = dotnet list ServerMonitor.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($output -match 'has the following vulnerable packages') {
            Write-Error 'Vulnerable packages detected.'
            exit 1
          }
          Write-Host 'No vulnerable packages found.'

      - name: CI measurement
        if: ${{ always() }}
        shell: pwsh
        run: |
          @(
            '## Release build + vulnerability scan'
            ''
            '- Cache action outcome: `${{ steps.nuget-cache.outcome }}`'
            '- Exact cache hit (`true` = hit; empty = miss): `${{ steps.nuget-cache.outputs.cache-hit }}`'
            '- Job and step wall-clock: GitHub Actions timestamps (authoritative)'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # PRIV-PDBPATH on the PACKAGE itself, on every PR: the same packaged build release-build.yml makes
  # (production identity, unsigned), then the gate with the reviewed third-party allowlist on the
  # .msix. This is what proves the allowlist holds for the runner's SDK, before a release depends on
  # it. Nothing is signed, uploaded or published, and no secret is involved.
  package-privacy:
    name: Packaged build + distribution privacy
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', 'global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json') }}

      - name: Restore
        run: dotnet restore ServerMonitor.slnx

      - name: Build the MSIX package (unsigned, as release-build.yml does)
        run: >
          dotnet build src/ServerMonitor.App/ServerMonitor.App.csproj
          -c Release -p:Packaged=true --no-incremental --disable-build-servers

      - name: Distribution privacy (package)
        shell: pwsh
        run: |
          $candidates = @(Get-ChildItem -Recurse -Filter '*.msix' -Path 'src/ServerMonitor.App/AppPackages' |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' })
          if ($candidates.Count -ne 1) { throw "Expected exactly one app MSIX, found $($candidates.Count)." }
          ./tools/release/Assert-DistributionPrivacy.ps1 `
            -Path $candidates[0].FullName `
            -AllowlistPath 'tools/release/distribution-privacy-allowlist.json'
